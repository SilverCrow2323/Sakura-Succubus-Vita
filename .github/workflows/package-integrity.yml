name: Vita package integrity

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Validate SFO, PNG and LiveArea metadata
        run: PYTHONPATH=. pytest -q
      - name: Run read-only package validator
        run: python tools/validate_vita_package.py
